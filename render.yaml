services:
  - type: web
    name: wanderline
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: MAPS_API_KEY
        sync: false
      - key: WEATHER_API_KEY
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
