<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="coverTitle coverDesc">
  <title id="coverTitle">Wanderline — Plan together. Travel lighter.</title>
  <desc id="coverDesc">Dark cover graphic in the Night map theme: map-ink background with a faint grid, amber accents, and a schematic of the trip workspace with day tabs, two plans, a shared-budget bar, and travelers.</desc>
  <defs>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#24362f" stroke-width="1"/>
    </pattern>
    <radialGradient id="warmGlow" cx="86%" cy="-6%" r="70%">
      <stop stop-color="#e2a15c" stop-opacity=".18"/>
      <stop offset="1" stop-color="#e2a15c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coolGlow" cx="4%" cy="104%" r="62%">
      <stop stop-color="#4a8a71" stop-opacity=".22"/>
      <stop offset="1" stop-color="#4a8a71" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#efb377"/>
      <stop offset="1" stop-color="#d08c47"/>
    </linearGradient>
    <linearGradient id="sage" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#6aa488"/>
      <stop offset="1" stop-color="#c8d9a8"/>
    </linearGradient>
    <linearGradient id="sagePill" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#c8d9a8"/>
      <stop offset="1" stop-color="#6aa488"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#0a1110"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity=".45"/>
  <rect width="1200" height="630" fill="url(#warmGlow)"/>
  <rect width="1200" height="630" fill="url(#coolGlow)"/>

  <g opacity=".13" fill="none" stroke="#8fbfa7">
    <path d="M-40 566C142 470 254 528 372 438s246-118 340-58 176 24 340-96" stroke-width="2" stroke-dasharray="7 11"/>
    <circle cx="372" cy="438" r="7" fill="#8fbfa7"/>
    <circle cx="712" cy="380" r="7" fill="#8fbfa7"/>
  </g>

  <g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <g transform="translate(72 58)">
      <rect width="56" height="56" rx="17" fill="url(#amber)"/>
      <path d="M17 30c12-15 21-14 25-9-3 11-12 19-25 22 2-5 2-8 0-13Z" fill="#0a1110"/>
      <text x="72" y="37" font-size="29" font-weight="700" letter-spacing="-.4" fill="#f2ede2">Wanderline</text>
    </g>

    <text x="72" y="200" font-size="12" font-weight="700" letter-spacing="2.4" fill="#e2a15c">COLLABORATIVE TRIP WORKSPACE</text>

    <g font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, 'Times New Roman', serif" font-size="68" letter-spacing="-1.8" fill="#f2ede2">
      <text x="68" y="272">Plan together.</text>
      <text x="68" y="344">Travel lighter.</text>
    </g>

    <g font-size="18" fill="#9aa89c">
      <text x="72" y="400">Saved places, shared expenses, travelers, packing, weather,</text>
      <text x="72" y="428">and group decisions in one calm, dark workspace.</text>
    </g>

    <g font-size="13" fill="#c2cfc6">
      <rect x="72" y="470" width="186" height="34" rx="17" fill="#0f1a16" stroke="#2a4039"/>
      <text x="90" y="492">Four dark appearances</text>
      <rect x="270" y="470" width="140" height="34" rx="17" fill="#0f1a16" stroke="#2a4039"/>
      <text x="288" y="492">Keyboard ready</text>
      <rect x="422" y="470" width="152" height="34" rx="17" fill="#0f1a16" stroke="#2a4039"/>
      <text x="440" y="492">Phone to desktop</text>
    </g>

    <text x="72" y="574" font-size="14" fill="#7d8f87">React · TypeScript · Vite · Google Maps actions</text>
  </g>

  <g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="700" y="84" width="428" height="462" rx="26" fill="#111b17" stroke="#23342d" stroke-width="1.5"/>
    <g clip-path="none">
      <text x="726" y="134" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, 'Times New Roman', serif" font-size="27" fill="#f2ede2">Lisbon</text>
      <text x="726" y="156" font-size="13" fill="#9aa89c">6 days · 4 travelers</text>

      <g>
        <circle cx="1044" cy="132" r="13" fill="#4a8a71"/>
        <circle cx="1064" cy="132" r="13" fill="#6d9c7f" stroke="#111b17" stroke-width="3"/>
        <circle cx="1084" cy="132" r="13" fill="#c8d9a8" stroke="#111b17" stroke-width="3"/>
        <text x="1044" y="136" font-size="10" font-weight="700" fill="#eef5ec" text-anchor="middle">N</text>
        <text x="1064" y="136" font-size="10" font-weight="700" fill="#0d1a16" text-anchor="middle">M</text>
        <text x="1084" y="136" font-size="10" font-weight="700" fill="#0d1a16" text-anchor="middle">A</text>
      </g>

      <g font-size="13" font-weight="600">
        <rect x="726" y="180" width="84" height="34" rx="11" fill="url(#sagePill)"/>
        <text x="768" y="202" fill="#0d1a16" text-anchor="middle">Fri 12</text>
        <rect x="818" y="180" width="80" height="34" rx="11" fill="#0f1a16" stroke="#23342d"/>
        <text x="858" y="202" fill="#93a79c" text-anchor="middle">Sat 13</text>
        <rect x="906" y="180" width="80" height="34" rx="11" fill="#0f1a16" stroke="#23342d"/>
        <text x="946" y="202" fill="#93a79c" text-anchor="middle">Sun 14</text>
      </g>

      <g>
        <rect x="726" y="236" width="376" height="82" rx="14" fill="#152220" stroke="#23342d"/>
        <text x="746" y="262" font-size="11" letter-spacing="1.1" fill="#9aa89c">09:40 · WALK</text>
        <text x="746" y="288" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, 'Times New Roman', serif" font-size="19" fill="#f2ede2">Alfama and the castle</text>
        <circle cx="752" cy="302" r="3.5" fill="#6aa488"/>
        <text x="763" y="306" font-size="12" fill="#b9c7bd">Confirmed · 4 going</text>
      </g>

      <g>
        <rect x="726" y="330" width="376" height="82" rx="14" fill="#152220" stroke="#23342d"/>
        <text x="746" y="356" font-size="11" letter-spacing="1.1" fill="#9aa89c">13:00 · FOOD</text>
        <text x="746" y="382" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, 'Times New Roman', serif" font-size="19" fill="#f2ede2">Time Out Market</text>
        <circle cx="752" cy="396" r="3.5" fill="#7d8f87"/>
        <text x="763" y="400" font-size="12" fill="#9aa89c">Planned · 3 going</text>
      </g>

      <g>
        <text x="726" y="448" font-size="12" fill="#9aa89c">Shared budget</text>
        <text x="1102" y="448" font-size="12" fill="#b9c7bd" text-anchor="end">Remaining</text>
        <rect x="726" y="460" width="376" height="8" rx="4" fill="#23342d"/>
        <rect x="726" y="460" width="238" height="8" rx="4" fill="url(#sage)"/>
      </g>

      <g>
        <path d="M726 500h376" stroke="#23342d" stroke-dasharray="4 6"/>
        <text x="726" y="526" font-size="12" fill="#9aa89c">Settlement ready</text>
        <path d="M1090 522h12m0 0-4-4m4 4-4 4" stroke="#e2a15c" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
  </g>
</svg>
