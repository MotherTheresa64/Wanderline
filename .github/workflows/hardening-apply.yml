name: Apply Wanderline hardening

on:
  push:
    branches: [hardening/recruiter-ready-2026-09-01]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wanderline-hardening
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Apply source transformations
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.hardening/apply.mjs')
          text = path.read_text()
          text = text.replace('Trip and itinerary dates use `YYYY-MM-DD` as calendar dates', 'Trip and itinerary dates use \\`YYYY-MM-DD\\` as calendar dates')
          path.write_text(text)
          PY
          node --check .hardening/apply.mjs
          node .hardening/apply.mjs
          python - <<'PY'
          from pathlib import Path
          app = Path('src/App.tsx')
          app.write_text('\n'.join(line.rstrip() for line in app.read_text().splitlines()) + '\n')
          lint = Path('scripts/lint-repo.mjs')
          text = lint.read_text().replace("const failures=[];for(const file of files){", "const failures=[];for(const file of files.filter(file=>file!=='scripts/lint-repo.mjs')){")
          lint.write_text(text)
          storage = Path('src/storage.ts')
          text = storage.read_text()
          text = text.replace("function textArray(value:unknown){return Array.isArray(value)&&value.every(text)}", "function textArray(value:unknown):value is string[]{return Array.isArray(value)&&value.every(text)}")
          text = text.replace("function finite(value:unknown){return typeof value==='number'&&Number.isFinite(value)}", "function finite(value:unknown):value is number{return typeof value==='number'&&Number.isFinite(value)}")
          storage.write_text(text)
          PY
      - name: Generate reproducible lockfile
        run: npm install --package-lock-only --include=dev --no-audit --no-fund
      - name: Install exact dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Reject whitespace errors
        run: git diff --check
      - name: Run full project verification
        run: npm run check
      - name: Smoke-test compiled server
        run: npm run smoke:server
      - name: Prepare validated source bundle
        run: |
          rm -rf .hardening
          rm -f .github/workflows/hardening-apply.yml
          tar --exclude=.git --exclude=node_modules --exclude=dist --exclude=dist-server -czf /tmp/wanderline-hardened.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: wanderline-hardened-source
          path: /tmp/wanderline-hardened.tgz
          if-no-files-found: error
          retention-days: 1
